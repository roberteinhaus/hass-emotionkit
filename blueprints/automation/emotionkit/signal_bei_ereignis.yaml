blueprint:
  name: "EmotionKit: Signal bei Ereignis"
  description: >-
    Schaltet bei ausgewählten Spielereignissen etwas für kurze Zeit ein, zum
    Beispiel eine Signalleuchte bei der Explosion der Bombe oder bei einem Ace.
  domain: automation
  author: EmotionKit
  source_url: https://github.com/roberteinhaus/hass-emotionkit/blob/main/blueprints/automation/emotionkit/signal_bei_ereignis.yaml
  homeassistant:
    min_version: "2026.7.0"
  input:
    game_event:
      name: Spielereignis
      description: Die Entität „Spielereignis" des EmotionKit-Geräts.
      selector:
        entity:
          filter:
            - integration: emotionkit
              domain: event
    event_types:
      name: Ereignisse
      default:
        - bomb_exploded
      selector:
        select:
          multiple: true
          options:
            - label: Bombe gelegt
              value: bomb_planted
            - label: Bombe entschärft
              value: bomb_defused
            - label: Bombe explodiert
              value: bomb_exploded
            - label: Freezetime beginnt
              value: freezetime
            - label: Runde gestartet
              value: round_live
            - label: Terroristen gewinnen die Runde
              value: round_over_t
            - label: Counter-Terrorists gewinnen die Runde
              value: round_over_ct
            - label: Match gestartet
              value: match_start
            - label: Halbzeit
              value: halftime
            - label: Match beendet
              value: match_over
            - label: Match gewonnen
              value: match_won
            - label: Match verloren
              value: match_lost
            - label: Runde gewonnen
              value: round_won
            - label: Runde verloren
              value: round_lost
            - label: Führung übernommen
              value: lead_taken
            - label: Ausgleich erzielt
              value: lead_equalized
            - label: Ausgleich kassiert
              value: lead_tied
            - label: In Rückstand geraten
              value: lead_behind
            - label: Siegesserie (ab 3 Runden)
              value: win_streak
            - label: "Bombe: noch 10 Sekunden"
              value: bomb_10s
            - label: Kill
              value: player_kill
            - label: Kopfschuss-Kill
              value: player_headshot
            - label: Doppelkill
              value: double_kill
            - label: Dreifachkill
              value: triple_kill
            - label: Vierfachkill
              value: quad_kill
            - label: Ace
              value: ace
            - label: Tod
              value: player_death
            - label: Geblendet
              value: player_flashed
            - label: Wenig Leben
              value: player_low_health
            - label: MVP der Runde
              value: player_mvp
            - label: Match verlassen
              value: match_left
            - label: Keine Spielaktivität (Leerlauf)
              value: idle
    signal:
      name: Schalter, Licht oder Sirene
      selector:
        target:
          entity:
            - domain:
                - switch
                - light
                - siren
    duration:
      name: Einschaltdauer
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: s

# A new event while the signal is on restarts the time.
mode: restart
max_exceeded: silent

triggers:
  - trigger: event.received
    target:
      entity_id: !input game_event
    options:
      event_type: !input event_types

actions:
  - action: homeassistant.turn_on
    target: !input signal
  - delay:
      seconds: !input duration
  - action: homeassistant.turn_off
    target: !input signal

[pytest]
# Tests against the real Home Assistant core; see requirements.txt.
#   pip install -r integrations/homeassistant/tests_ha/requirements.txt
#   python -m pytest integrations/homeassistant/tests_ha
# The unit tests in ../tests need none of this and are run separately.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Makes `custom_components` (one directory up) importable.
pythonpath = ..
testpaths = .
